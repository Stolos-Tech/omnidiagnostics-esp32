; ESP32-C6 analysis node (Waveshare ESP32-C6-WROOM-1).
; C6 needs Arduino-ESP32 core 3.x — use the pioarduino community platform
; (official platform-espressif32 lagged on C6/RISC-V + 802.15.4 support).
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1        ; native USB CDC = programming/log
    -DC6_LINK_BAUD=921600              ; UART link to HOST (T-Display)
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    nrf24/RF24 @ ^1.4.8               ; nRF24 driver (radio moved here)
    ; CC1101: SmartRC-CC1101-Driver-Lib or ELECHOUSE — pin to a C6-safe fork later

[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
