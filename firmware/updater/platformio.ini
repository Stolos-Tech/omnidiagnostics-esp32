; factory-updater: мінімальна прошивка, що пише ота_0 з SD /firmware.bin.
; Без WiFi/BT/TFT-важкого -> влазить у factory (0xB0000). Та сама 4МБ-таблиця.
[env:updater]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
board_build.partitions = ../../partitions_esp32os_ota.csv
build_flags = -D CORE_DEBUG_LEVEL=0
