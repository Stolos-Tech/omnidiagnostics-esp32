; ============================================================
;  OmniDiagnostics-ESP32 :: PlatformIO project configuration
;  Target board: LilyGO T-Display V1.1 (ESP32-WROOM, ST7789 135x240)
;
;  TFT_eSPI is configured here via build_flags (USER_SETUP_LOADED),
;  so there is NO need to edit User_Setup.h inside the library.
; ============================================================

[env:ttgo-t-display]
platform      = espressif32
board         = esp32dev            ; ESP32-WROOM, 4 MB flash
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = min_spiffs.csv   ; default table is too small for WiFi+BLE+TFT

build_flags =
    ; ---- TFT_eSPI: driver and T-Display pin mapping ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MISO=-1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=1
    ; ---- fonts ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^1.4.1      ; lightweight BLE stack (smaller than Bluedroid)
    ; Enable when the matching hardware is wired:
    ; crankyoldgit/IRremoteESP8266      ; IR analyzer
    ; CC1101 sub-GHz: SmartRC-CC1101-Driver-Lib + rc-switch
