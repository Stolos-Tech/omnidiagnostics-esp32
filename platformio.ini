; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ttgo-t-display

[env:ttgo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; Кастомна таблиця розділів: без OTA, великий app (WiFi+BT+Berry не влазять у дефолт)
board_build.partitions = partitions_esp32os.csv
; Авто-gzip data/web/index.html перед збіркою LittleFS (плата віддає .gz -> надійно при малій купі)
extra_scripts = gzip_web.py
lib_deps =
	TFT_eSPI=symlink://../TFT_eSPI-master
	ESP32Ping=symlink://../ESP32Ping-master
	berry
	bblanchon/ArduinoJson@^7
	links2004/WebSockets@^2.4.1
build_flags =
	-D USER_SETUP_LOADED=1
	-include include/TFT_eSPI_Setup.h
; QA: суворі попередження ЛИШЕ для нашого src/ (не бібліотек) — ловлять мертвий код,
; unused, неініціалізоване. Приглушено 2 шумні хибні класи: misleading-indentation
; (навмисний стиль if(x)a; if(y)b; для клампів) і format-truncation (обмежені UI-рядки).
build_src_flags =
	-Wall
	-Wextra
	-Wno-misleading-indentation
	-Wno-format-truncation

[env:native]
platform = windows_x86
test_framework = unity
test_build_src = true
lib_deps = 
	berry
	bblanchon/ArduinoJson@^7
build_src_filter = 
	-<*>
	+<kernel/launcher.cpp>
	+<kernel/input_queue.cpp>
	+<kernel/script_path.cpp>
	+<kernel/format_util.cpp>
	+<kernel/net_util.cpp>
	+<kernel/url_util.cpp>
	+<kernel/rf24_util.cpp>
	+<kernel/subghz_util.cpp>
	+<kernel/ook_decode.cpp>
	+<kernel/ook_encode.cpp>
	+<kernel/archive_category.cpp>
	+<kernel/power_model.cpp>
	+<kernel/cooling.cpp>
	+<kernel/tracker_id.cpp>
	+<kernel/oui_vendor.cpp>
	+<kernel/skimmer_id.cpp>
	+<kernel/attacker_id.cpp>
	+<drivers/uno_proto.cpp>
	+<kernel/power_state.cpp>
	+<kernel/shared_store.cpp>
	+<kernel/power_guard.cpp>
	+<kernel/backlight_policy.cpp>
	+<kernel/device_id.cpp>
	+<kernel/log_ring.cpp>
	+<drivers/button_edge.cpp>
	+<drivers/tap_hold.cpp>
	+<berry_bridge/berry_vm.cpp>
	+<berry_bridge/native_api.cpp>
	+<remote/protocol.cpp>
	+<remote/session.cpp>
	+<remote/remote_dispatch.cpp>
	+<remote/line_assembler.cpp>
build_flags = -std=gnu++17
