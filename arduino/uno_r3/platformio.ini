; PlatformIO Project Configuration File — окремий проєкт для Arduino UNO R3.
; Відкривається/прошивається у VS Code незалежно від головного esp32-os проєкту
; (`code arduino/uno_r3` або "Open Folder" саме на цій папці).

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
	miguelbalboa/MFRC522@^1.4.11
	z3t0/IRremote@^4.4.1
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = -std=gnu++17

; Юніт-тести чистої логіки протоколу (без апаратних бібліотек) — `pio test -e native`.
[env:native]
platform = windows_x86
test_framework = unity
test_build_src = true
build_src_filter =
	-<*>
	+<link_proto.cpp>
build_flags = -std=gnu++17
